# ==================================================
# BANCO DE DADOS ORACLE
# Valores fornecidos por variaveis de ambiente
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==================================================
# HIKARI - POOL DE CONEXOES
# ==================================================

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:2}

# ==================================================
# HIBERNATE / JPA
# ==================================================

spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==================================================
# CONFIGURACOES DA APLICACAO
# ==================================================

server.port=${SERVER_PORT:8080}

spring.jackson.deserialization.fail-on-unknown-properties=false

spring.flyway.enabled=false
server.error.include-stacktrace=never